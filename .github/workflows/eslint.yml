name: ESLint

on: [push, pull_request]

jobs:
  eslint:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '20.15.1'
        cache: 'yarn'

    # Run yarn install for JS dependencies
    - name: 'Yarn Install'
      run: yarn install

    - name: 'Run ESLint'
      run: yarn run eslint app/javascript/**/*.js --ext .js
