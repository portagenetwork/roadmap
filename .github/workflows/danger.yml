name: Danger

on: [push, pull_request]

jobs:
  danger:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    # Install Ruby and run bundler
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: 'Run Danger'
      env:
        DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bundle exec danger