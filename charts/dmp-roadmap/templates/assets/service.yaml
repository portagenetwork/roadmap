apiVersion: v1
kind: Service
metadata:
  name: {{ include "dmp-roadmap.fullname" . }}-assets
  labels:
    {{- $_ := set . "component" "assets" }}
    {{- include "dmp-roadmap.labels" . | nindent 4 }}
spec:
  type: {{ .Values.assets.service.type }}
  ports:
    - port: {{ .Values.assets.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- $_ := set . "component" "assets" }}
    {{- include "dmp-roadmap.selectorLabels" . | nindent 4 }}
