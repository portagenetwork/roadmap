{{- if .Values.cronjobs.translationSync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dmp-roadmap.fullname" . }}-translation-sync
  labels:
    {{- $_ := set . "component" "cronjob-translation-sync" }}
    {{- include "dmp-roadmap.labels" . | nindent 4 }}
spec:
  schedule: "{{ .Values.cronjobs.translationSync.schedule }}"
  concurrencyPolicy: {{ .Values.cronjobs.translationSync.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjobs.translationSync.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjobs.translationSync.failedJobsHistoryLimit }}
  suspend: {{ .Values.cronjobs.translationSync.suspend }}
  jobTemplate:
    spec:
      template:
        metadata:
          {{- with .Values.cronjobs.translationSync.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- $_ := set . "component" "cronjob-translation-sync" }}
            {{- include "dmp-roadmap.labels" . | nindent 12 }}
            app.kubernetes.io/part-of: cronjob
            {{- with .Values.cronjobs.translationSync.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          {{- with .Values.app.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cronjobs.translationSync.priorityClassName | default .Values.app.priorityClassName | default .Values.global.priorityClassName }}
          priorityClassName: {{ . }}
          {{- end }}
          serviceAccountName: {{ include "dmp-roadmap.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.app.podSecurityContext | nindent 12 }}
          restartPolicy: {{ .Values.cronjobs.translationSync.restartPolicy }}
          containers:
            - name: {{ .Chart.Name }}-translation-sync
              image: "{{ .Values.app.image.repository | default .Values.global.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ default .Values.global.image.imagePullPolicy .Values.app.image.imagePullPolicy }}
              env:
                {{- with (concat .Values.global.env .Values.app.env .Values.cronjobs.translationSync.env) }}
                  {{- toYaml . | nindent 16 }}
                {{- end }}
              envFrom:
                - configMapRef:
                    name: {{ include "dmp-roadmap.fullname" . }}-app-config
                {{- with .Values.app.envFrom }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              command:
                - bundle
                - exec
                - rake
                - translation:sync
              securityContext:
                {{- toYaml .Values.app.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.cronjobs.translationSync.resources | nindent 16 }}
              volumeMounts:
                {{- if hasKey .Values.storage.cephfs.volumes "locales" }}
                - name: locales
                  mountPath: {{ .Values.storage.cephfs.volumes.locales.mountPath }}
                {{- end }}
                # Required tmp directories for Rails
                - name: rails-tmp
                  mountPath: /usr/src/app/tmp
                {{- with .Values.cronjobs.translationSync.volumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            {{- if hasKey .Values.storage.cephfs.volumes "locales" }}
            - name: locales
              persistentVolumeClaim:
                claimName: {{ include "dmp-roadmap.fullname" $ }}-locales
            {{- end }}
            # Tmp directories required for Rails
            - name: rails-tmp
              emptyDir: {}
            {{- with .Values.cronjobs.translationSync.volumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.cronjobs.translationSync.nodeSelector | default .Values.app.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cronjobs.translationSync.affinity | default .Values.app.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
           {{- with .Values.cronjobs.translationSync.tolerations | default .Values.app.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
