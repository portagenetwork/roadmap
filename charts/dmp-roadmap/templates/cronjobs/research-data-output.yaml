{{- if .Values.cronjobs.researchDataOutput.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dmp-roadmap.fullname" . }}-research-data-output
  labels:
    {{- $_ := set . "component" "cronjob-research-data-output" }}
    {{- include "dmp-roadmap.labels" . | nindent 4 }}
spec:
  schedule: "{{ .Values.cronjobs.researchDataOutput.schedule }}"
  concurrencyPolicy: {{ .Values.cronjobs.researchDataOutput.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjobs.researchDataOutput.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjobs.researchDataOutput.failedJobsHistoryLimit }}
  suspend: {{ .Values.cronjobs.researchDataOutput.suspend }}
  jobTemplate:
    spec:
      template:
        metadata:
          {{- with .Values.cronjobs.researchDataOutput.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- $_ := set . "component" "cronjob-research-data-output" }}
            {{- include "dmp-roadmap.labels" . | nindent 12 }}
            app.kubernetes.io/part-of: cronjob
            {{- with .Values.cronjobs.researchDataOutput.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          {{- with .Values.app.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cronjobs.researchDataOutput.priorityClassName | default .Values.app.priorityClassName | default .Values.global.priorityClassName }}
          priorityClassName: {{ . }}
          {{- end }}
          serviceAccountName: {{ include "dmp-roadmap.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.app.podSecurityContext | nindent 12 }}
          restartPolicy: {{ .Values.cronjobs.researchDataOutput.restartPolicy }}
          containers:
            - name: {{ .Chart.Name }}-research-data-output
              image: "{{ .Values.app.image.repository | default .Values.global.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ default .Values.global.image.imagePullPolicy .Values.app.image.imagePullPolicy }}
              env:
                {{- with (concat .Values.global.env .Values.app.env .Values.cronjobs.researchDataOutput.env) }}
                  {{- toYaml . | nindent 16 }}
                {{- end }}
              envFrom:
                - configMapRef:
                    name: {{ include "dmp-roadmap.fullname" . }}-app-config
                {{- with .Values.app.envFrom }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              securityContext:
                {{- toYaml .Values.app.securityContext | nindent 16 }}
              command:
                - /bin/sh
                - -c
                - |
                  # Run each task in sequence, continuing even if one fails
                  time bundle exec rake external_api:load_rdamsc_standards || true
                  time bundle exec rake external_api:load_re3data_repos || true
                  time bundle exec rake external_api:load_spdx_licenses || true
              resources:
                {{- toYaml .Values.cronjobs.researchDataOutput.resources | nindent 16 }}
              volumeMounts:
                # Required tmp directories for Rails
                - name: tmp
                  mountPath: /usr/src/app/tmp
                - name: cache
                  mountPath: /usr/src/app/tmp/cache
                {{- with .Values.cronjobs.researchDataOutput.volumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            # Tmp directories required for Rails
            - name: tmp
              emptyDir: {}
            - name: cache
              emptyDir: {}
            {{- with .Values.cronjobs.researchDataOutput.volumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.cronjobs.researchDataOutput.nodeSelector | default .Values.app.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cronjobs.researchDataOutput.affinity | default .Values.app.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cronjobs.researchDataOutput.tolerations | default .Values.app.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
