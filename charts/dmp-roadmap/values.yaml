---
# yaml-language-server: $schema=values.schema.json
# Default values for dmp-roadmap.

# @schema
# type: string
# @schema
# -- Provide a name in place of `dmp-roadmap`
nameOverride: ''
# @schema
# type: string
# @schema
# -- String to fully override `dmp-roadmap.fullname`
fullnameOverride: ''
# @schema
# type: string
# @schema
# -- Override the namespace
# @default -- `.Release.Namespace`
namespaceOverride: ''

## @section Global parameters

# @schema
# type: object
# @schema
global:
  # @schema
  # type: object
  # @schema
  # -- Global domain configuration
  # @section -- Global parameters
  domain:
    # @schema
    # type: string
    # format: hostname
    # @schema
    # -- Main domain name used throughout the chart
    # @section -- Global parameters
    name: example.com
    # @schema
    # type: string
    # @schema
    # -- Application path/context (e.g., /staging)
    # @section -- Global parameters
    path: ''
    # @schema
    # type: string
    # @schema
    # -- Application prefix (e.g., staging)
    # @section -- Global parameters
    prefix: ''

  # @schema
  # type: object
  # @schema
  # -- Default image used by all components
  # @section -- Global parameters
  image:
    # @schema
    # type: string
    # @schema
    # -- If defined, a repository applied to all DMP Roadmap deployments
    # @section -- Global parameters
    repository: ualbertalib/dmp_roadmap
    # @schema
    # type: string
    # @schema
    # -- Overrides the global DMP Roadmap image tag whose default is the chart appVersion
    # @section -- Global parameters
    tag: ''
    # @schema
    # enum: [Always, IfNotPresent, Never]
    # @schema
    # -- If defined, a imagePullPolicy applied to all DMP Roadmap deployments
    # @section -- Global parameters
    imagePullPolicy: IfNotPresent

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Common labels for the all resources
  # @section -- Global parameters
  additionalLabels: {}
    # app: dmp-r

  # @schema
  # type: array
  # @schema
  # -- Secrets with credentials to pull images from a private registry
  # @section -- Global parameters
  imagePullSecrets: []

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Annotations for the all deployed Statefulsets
  # @section -- Global parameters
  statefulsetAnnotations: {}

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Annotations for the all deployed Deployments
  # @section -- Global parameters
  deploymentAnnotations: {}

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Annotations for the all deployed pods
  # @section -- Global parameters
  podAnnotations: {}

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Labels for the all deployed pods
  # @section -- Global parameters
  podLabels: {}

  # @schema
  # type: string
  # @schema
  # -- Default priority class for all components
  # @section -- Global parameters
  priorityClassName: ''

  # @schema
  # type: array
  # @schema
  # -- Environment variables to pass to all deployed Deployments
  # @section -- Global parameters
  env: []

## @section Application Configuration

# @schema
# type: object
# @schema
app:
  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- Number of app replicas
  # @section -- Application Configuration
  replicas: 1

  # @schema
  # type: object
  # @schema
  ## DMP Roadmap app image
  image:
    # @schema
    # type: string
    # @schema
    # -- Repository to use for the DMP Roadmap app
    # @default -- global.image.repository
    # @section -- Application Configuration
    repository: ''
    # @schema
    # type: string
    # @schema
    # -- Tag to use for the DMP Roadmap app
    # @default -- global.image.tag or chart appVersion
    # @section -- Application Configuration
    tag: ''
    # @schema
    # enum: [Always, IfNotPresent, Never, ""]
    # @schema
    # -- Image pull policy for the DMP Roadmap app
    # @default -- global.image.imagePullPolicy
    # @section -- Application Configuration
    imagePullPolicy: ''

  # @schema
  # type: array
  # @schema
  # -- Secrets with credentials to pull images from a private registry
  # @default -- global.imagePullSecrets
  # @section -- Application Configuration
  imagePullSecrets: []

  # @schema
  # type: array
  # @schema
  # -- Environment variables to pass to DMP Roadmap app
  # @section -- Application Configuration
  env: []

  # @schema
  # type: array
  # @schema
  # -- envFrom to pass to DMP Roadmap app
  # @section -- Application Configuration
  envFrom: []
  # - configMapRef:
  #     name: config-map-name
  # - secretRef:
  #     name: secret-name
  # @schema
  # type: object
  # @schema
  serviceAccount:
    # @schema
    # type: boolean
    # @schema
    # -- Specifies whether a service account should be created
    # @section -- Application Configuration
    create: true
    # @schema
    # type: boolean
    # @schema
    # -- Automatically mount a ServiceAccount's API credentials?
    # @section -- Application Configuration
    automount: true
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Annotations to add to the service account
    # @section -- Application Configuration
    annotations: {}
    # @schema
    # type: string
    # @schema
    # -- The name of the service account to use.
    # @default -- If not set and create is true, a name is generated using the fullname template
    # @section -- Application Configuration
    name: ''

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Pod annotations for the app deployment
  # @section -- Application Configuration
  podAnnotations: {}
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Pod labels for the app deployment
  # @section -- Application Configuration
  podLabels: {}

  # @schema
  # type: object
  # @schema
  # -- Pod security context for the app deployment
  # @section -- Application Configuration
  podSecurityContext:
    fsGroup: 3000

  # @schema
  # type: object
  # @schema
  # -- Container security context for the app deployment
  # @section -- Application Configuration
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  # @schema
  # type: object
  # @schema
  service:
    # @schema
    # enum: [ClusterIP, NodePort, LoadBalancer, ExternalName]
    # @schema
    # -- Service type for the app
    # @section -- Application Configuration
    type: ClusterIP
    # @schema
    # type: integer
    # minimum: 1
    # maximum: 65535
    # @schema
    # -- Service port for the app
    # @section -- Application Configuration
    port: 8080
    # @schema
    # type: integer
    # minimum: 1
    # maximum: 65535
    # @schema
    # -- Target port for the app container
    # @section -- Application Configuration
    targetPort: 3000

  # @schema
  # type: object
  # @schema
  # -- Resource requests and limits for the app
  # @section -- Application Configuration
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  # -- Startup probe configuration for the app
  # @section -- Application Configuration
  startupProbe:
    httpGet:
      path: /api/v1/heartbeat
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 48
    successThreshold: 1

  # -- Liveness probe configuration for the app
  # @section -- Application Configuration
  livenessProbe:
    httpGet:
      path: /api/v1/heartbeat
      port: http
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  # -- Readiness probe configuration for the app
  # @section -- Application Configuration
  readinessProbe:
    httpGet:
      path: /api/v1/heartbeat
      port: http
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  # -- Autoscaling configuration for the app
  # @section -- Application Configuration
  autoscaling:
    # -- Enable autoscaling for the app
    # @section -- Application Configuration
    enabled: false
    # -- Minimum number of replicas
    # @section -- Application Configuration
    minReplicas: 1
    # -- Maximum number of replicas
    # @section -- Application Configuration
    maxReplicas: 100
    # -- Target CPU utilization percentage
    # @section -- Application Configuration
    targetCPUUtilizationPercentage: 80
    # -- Target memory utilization percentage
    # targetMemoryUtilizationPercentage: 80

  # -- Additional volumes for the app deployment
  # @section -- Application Configuration
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # -- Additional volume mounts for the app deployment
  # @section -- Application Configuration
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  # -- Node selector for the app deployment
  # @section -- Application Configuration
  nodeSelector: {}

  # -- Tolerations for the app deployment
  # @section -- Application Configuration
  tolerations: []

  # -- Affinity settings for the app deployment
  # @section -- Application Configuration
  affinity: {}

## @section Assets Configuration

assets:
  # -- Number of assets replicas
  # @section -- Assets Configuration
  replicas: 1

  ## DMP Roadmap assets image
  image:
    # -- Repository to use for the DMP Roadmap assets
    # @default -- global.image.repository
    # @section -- Assets Configuration
    repository: ''
    # -- Tag to use for the DMP Roadmap assets
    # @default -- global.image.tag or chart appVersion
    # @section -- Assets Configuration
    tag: ''
    # -- Image pull policy for the DMP Roadmap assets
    # @default -- global.image.imagePullPolicy
    # @section -- Assets Configuration
    imagePullPolicy: ''

  # -- Secrets with credentials to pull images from a private registry
  # @default -- global.imagePullSecrets
  # @section -- Assets Configuration
  imagePullSecrets: []

  # -- Environment variables to pass to DMP Roadmap assets
  # @section -- Assets Configuration
  env: []

  # -- envFrom to pass to DMP Roadmap assets
  # @section -- Assets Configuration
  envFrom: []
  # - configMapRef:
  #     name: config-map-name
  # - secretRef:
  #     name: secret-name
  serviceAccount:
    # -- Specifies whether a service account should be created
    # @section -- Assets Configuration
    create: true
    # -- Automatically mount a ServiceAccount's API credentials?
    # @section -- Assets Configuration
    automount: true
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Annotations to add to the service account
    # @section -- Assets Configuration
    annotations: {}
    # -- The name of the service account to use.
    # @default -- If not set and create is true, a name is generated using the fullname template
    # @section -- Assets Configuration
    name: ''

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Pod annotations for the assets deployment
  # @section -- Assets Configuration
  podAnnotations: {}
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Pod labels for the assets deployment
  # @section -- Assets Configuration
  podLabels: {}

  # -- Pod security context for the assets deployment
  # @section -- Assets Configuration
  podSecurityContext:
    fsGroup: 3000

  # -- Container security context for the assets deployment
  # @section -- Assets Configuration
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  service:
    # -- Service type for the assets
    # @section -- Assets Configuration
    type: ClusterIP
    # -- Service port for the assets
    # @section -- Assets Configuration
    port: 8080
    # -- Target port for the assets container
    # @section -- Assets Configuration
    targetPort: 8080

  # -- Resource requests and limits for the assets
  # @section -- Assets Configuration
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # -- Liveness probe configuration for the assets
  # @section -- Assets Configuration
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 120
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  # -- Readiness probe configuration for the assets
  # @section -- Assets Configuration
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
    successThreshold: 1

  # -- Autoscaling configuration for the assets
  # @section -- Assets Configuration
  autoscaling:
    # -- Enable autoscaling for the assets
    # @section -- Assets Configuration
    enabled: false
    # -- Minimum number of replicas
    # @section -- Assets Configuration
    minReplicas: 1
    # -- Maximum number of replicas
    # @section -- Assets Configuration
    maxReplicas: 100
    # -- Target CPU utilization percentage
    # @section -- Assets Configuration
    targetCPUUtilizationPercentage: 80
    # -- Target memory utilization percentage
    # targetMemoryUtilizationPercentage: 80

  # -- Additional volumes for the assets deployment
  # @section -- Assets Configuration
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # -- Additional volume mounts for the assets deployment
  # @section -- Assets Configuration
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  # -- Node selector for the assets deployment
  # @section -- Assets Configuration
  nodeSelector: {}

  # -- Tolerations for the assets deployment
  # @section -- Assets Configuration
  tolerations: []

  # -- Affinity settings for the assets deployment
  # @section -- Assets Configuration
  affinity: {}

## @section Ingress Configuration

# @schema
# type: object
# @schema
ingress:
  # @schema
  # type: boolean
  # @schema
  # -- Enable or disable the ingress
  # @section -- Ingress Configuration
  enabled: false

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Annotations for the ingress resource
  # @section -- Ingress Configuration
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/issuer: letsencrypt-prod
    # cert-manager.io/cluster-issuer: letsencrypt-prod

  # @schema
  # type: string
  # @schema
  # -- Ingress class name
  # @section -- Ingress Configuration
  className: ''

  # @schema
  # type: array
  # @schema
  # -- Hosts configuration (if empty, uses global.domain.name)
  # @section -- Ingress Configuration
  hosts: []
  # Example of manual host configuration:
  #  - host: custom-domain.com
  #    paths:
  #      - path: /
  #        pathType: Prefix

  # @schema
  # type: array
  # @schema
  # -- TLS configuration for the ingress
  # @section -- Ingress Configuration
  tls: []
  #  - secretName: dmp-roadmap-tls
  #    hosts:
  #      - chart-example.local

  # @schema
  # type: object
  # @schema
  # -- Automatic TLS certificate management with cert-manager
  # @section -- Ingress Configuration
  certManager:
    # @schema
    # type: boolean
    # @schema
    # -- Enable automatic TLS certificate management
    # @section -- Ingress Configuration
    enabled: false
    # @schema
    # type: string
    # @schema
    # -- Issuer name (for namespace-scoped issuer)
    # @section -- Ingress Configuration
    issuer: ""
    # @schema
    # type: string
    # @schema
    # -- ClusterIssuer name (for cluster-scoped issuer)
    # @section -- Ingress Configuration
    clusterIssuer: ""
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Additional annotations for cert-manager
    # @section -- Ingress Configuration
    annotations: {}

    # @schema
    # type: object
    # @schema
    # -- ACME configuration for Let's Encrypt
    # @section -- Ingress Configuration
    acme:
      # @schema
      # type: string
      # format: uri
      # @schema
      # -- ACME server URL
      # @section -- Ingress Configuration
      server: https://acme-v02.api.letsencrypt.org/directory
      # @schema
      # type: string
      # format: email
      # @schema
      # -- Email address for ACME registration
      # @section -- Ingress Configuration
      email: support@example.com
      # @schema
      # type: object
      # @schema
      # -- HTTP-01 challenge configuration
      # @section -- Ingress Configuration
      http01:
        # @schema
        # type: boolean
        # @schema
        # -- Enable HTTP-01 challenge
        # @section -- Ingress Configuration
        enabled: false
        # -- Ingress class for HTTP-01 challenge
        # @section -- Ingress Configuration
        ingressClass: ""
      # -- DNS-01 challenge configuration
      # @section -- Ingress Configuration
      dns01:
        # -- Enable DNS-01 challenge
        # @section -- Ingress Configuration
        enabled: false
        # -- Cloudflare DNS-01 configuration
        # @section -- Ingress Configuration
        cloudflare:
          # -- Cloudflare email
          # @section -- Ingress Configuration
          email: support@example.com
          # -- Cloudflare API token secret reference
          # @section -- Ingress Configuration
          apiTokenSecretRef:
            # -- Secret name containing Cloudflare API token
            # @section -- Ingress Configuration
            name: ""
            # -- Secret key containing Cloudflare API token
            # @section -- Ingress Configuration
            key: "CF_API_KEY"

    # -- CA issuer configuration
    # @section -- Ingress Configuration
    ca:
      # -- Secret name containing CA certificate and private key
      # @section -- Ingress Configuration
      secretName: ""

    # -- Vault issuer configuration
    # @section -- Ingress Configuration
    vault:
      # -- Vault server URL
      # @section -- Ingress Configuration
      server: ""
      # -- Vault path for certificate signing
      # @section -- Ingress Configuration
      path: ""
      # -- Vault authentication configuration
      # @section -- Ingress Configuration
      auth: {}

    # -- Certificate Request Policy configuration
    # @section -- Ingress Configuration
    certificateRequestPolicy:
      # -- Enable Certificate Request Policy
      # @section -- Ingress Configuration
      enabled: false
      # -- Name for the Certificate Request Policy
      # @section -- Ingress Configuration
      name: ""
      # -- Allowed certificate properties
      # @section -- Ingress Configuration
      allowed:
        # -- Common name for certificates
        # @section -- Ingress Configuration
        commonName: ""
        # -- DNS names allowed for certificates
        # @section -- Ingress Configuration
        dnsNames: []
        # -- Certificate usage constraints
        # @section -- Ingress Configuration
        usages:
          - server auth
          - digital signature
          - key encipherment
      # -- Certificate constraints
      # @section -- Ingress Configuration
      constraints:
        # -- Private key constraints
        # @section -- Ingress Configuration
        privateKey:
          # -- Private key algorithm
          # @section -- Ingress Configuration
          algorithm: RSA
          # -- Minimum private key size
          # @section -- Ingress Configuration
          minSize: 2048

    # -- RBAC configuration for cert-manager policies
    # @section -- Ingress Configuration
    rbac:
      # -- Enable RBAC for cert-manager policies
      # @section -- Ingress Configuration
      enabled: false
      # -- Role name for cert-manager policy access
      # @section -- Ingress Configuration
      roleName: ""
      # -- RoleBinding name for cert-manager policy access
      # @section -- Ingress Configuration
      roleBindingName: ""
      # -- cert-manager namespace (where cert-manager ServiceAccount is located)
      # @section -- Ingress Configuration
      certManagerNamespace: "cert-manager"
      # -- Policy names that can be used
      # @section -- Ingress Configuration
      policyNames: []
      # -- Custom subjects for the RoleBinding
      # @section -- Ingress Configuration
      subjects: []

## @section Storage Configuration

# -- Storage configuration for the application
# @section -- Storage Configuration
storage:
  # -- Storage type (pvc, cephfs, hostPath, nfs, emptyDir)
  # @section -- Storage Configuration
  type: pvc

  # -- Standard PVC storage configuration
  # @section -- Storage Configuration
  pvc:
    # -- Storage class name (leave empty for default)
    # @section -- Storage Configuration
    storageClassName: ""
    # -- Storage reclaim policy
    # @section -- Storage Configuration
    persistentVolumeReclaimPolicy: Retain
    # -- Volume mode
    # @section -- Storage Configuration
    volumeMode: Filesystem
    # -- Access modes for the volumes
    # @section -- Storage Configuration
    accessModes:
      - ReadWriteOnce

    # -- Volume definitions for PVC
    # @section -- Storage Configuration
    volumes:
      # -- Locales volume configuration (shared between app and cronjobs)
      # @section -- Storage Configuration
      locales:
        # -- Size for the locales volume
        # @section -- Storage Configuration
        size: 5Gi
        # -- Mount path for the locales volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/config/locale
        # -- Access modes (needs ReadWriteMany for sharing between pods)
        # @section -- Storage Configuration
        accessModes:
          - ReadWriteMany

      # -- Uploads volume configuration
      # @section -- Storage Configuration
      uploads:
        # -- Size for the uploads volume
        # @section -- Storage Configuration
        size: 5Gi
        # -- Mount path for the uploads volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/public/system/dragonfly
        # -- Access modes (override global if needed)
        # @section -- Storage Configuration
        accessModes: []

  # -- CephFS storage configuration
  # @section -- Storage Configuration
  cephfs:
    # -- Storage reclaim policy
    # @section -- Storage Configuration
    persistentVolumeReclaimPolicy: Retain
    # -- Volume mode
    # @section -- Storage Configuration
    volumeMode: Filesystem
    # -- Access modes for the volumes
    # @section -- Storage Configuration
    accessModes:
      - ReadWriteMany
    # -- CephFS monitors
    # @section -- Storage Configuration
    monitors: []

    # -- Volume definitions for CephFS
    # @section -- Storage Configuration
    volumes:
      # -- Locales volume configuration
      # @section -- Storage Configuration
      locales:
        # -- Path for the locales volume
        # @section -- Storage Configuration
        path: ''
        # -- Size for the locales volume
        # @section -- Storage Configuration
        size: 5Gi
        # -- Mount path for the locales volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/config/locale
        # -- Secret reference for the locales volume
        # @section -- Storage Configuration
        secretRef: cephfs-locales-key

      # -- Uploads volume configuration
      # @section -- Storage Configuration
      uploads:
        # -- Path for the uploads volume
        # @section -- Storage Configuration
        path: ''
        # -- Size for the uploads volume
        # @section -- Storage Configuration
        size: 5Gi
        # -- Mount path for the uploads volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/public/system/dragonfly
        # -- Secret reference for the uploads volume
        # @section -- Storage Configuration
        secretRef: cephfs-uploads-key

  # -- Host path storage configuration
  # @section -- Storage Configuration
  hostPath:
    # -- Volume definitions for hostPath
    # @section -- Storage Configuration
    volumes:
      # -- Locales volume configuration
      # @section -- Storage Configuration
      locales:
        # -- Path on the host
        # @section -- Storage Configuration
        path: /data/dmp-roadmap/locales
        # -- Host path type
        # @section -- Storage Configuration
        type: DirectoryOrCreate
        # -- Mount path for the locales volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/config/locale

      # -- Uploads volume configuration
      # @section -- Storage Configuration
      uploads:
        # -- Path on the host
        # @section -- Storage Configuration
        path: /data/dmp-roadmap/uploads
        # -- Host path type
        # @section -- Storage Configuration
        type: DirectoryOrCreate
        # -- Mount path for the uploads volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/public/system/dragonfly

  # -- NFS storage configuration
  # @section -- Storage Configuration
  nfs:
    # -- NFS server address
    # @section -- Storage Configuration
    server: ""
    # -- Volume definitions for NFS
    # @section -- Storage Configuration
    volumes:
      # -- Locales volume configuration
      # @section -- Storage Configuration
      locales:
        # -- Path on the NFS server
        # @section -- Storage Configuration
        path: /data/dmp-roadmap/locales
        # -- Mount path for the locales volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/config/locale

      # -- Uploads volume configuration
      # @section -- Storage Configuration
      uploads:
        # -- Path on the NFS server
        # @section -- Storage Configuration
        path: /data/dmp-roadmap/uploads
        # -- Mount path for the uploads volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/public/system/dragonfly

  # -- EmptyDir storage configuration (temporary, data lost on pod restart)
  # @section -- Storage Configuration
  emptyDir:
    # -- Volume definitions for emptyDir
    # @section -- Storage Configuration
    volumes:
      # -- Locales volume configuration
      # @section -- Storage Configuration
      locales:
        # -- Size limit for the volume
        # @section -- Storage Configuration
        sizeLimit: 1Gi
        # -- Mount path for the locales volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/config/locale

      # -- Uploads volume configuration
      # @section -- Storage Configuration
      uploads:
        # -- Size limit for the volume
        # @section -- Storage Configuration
        sizeLimit: 5Gi
        # -- Mount path for the uploads volume
        # @section -- Storage Configuration
        mountPath: /usr/src/app/public/system/dragonfly

## @section Application Settings

# @schema
# type: object
# @schema
# -- Configuration values for the application
# @section -- Application Settings
config:
  # @schema
  # type: object
  # @schema
  # -- Application and host settings
  # @section -- Application Settings
  application:
    # @schema
    # type: string
    # @schema
