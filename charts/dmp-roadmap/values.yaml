## @section Network Policies

# -- Network policy configuration
# @section -- Network Policies
networkPolicy:
  # -- Enable network policies
  # @section -- Network Policies
  enabled: false

  # -- Ingress source configuration
  # @section -- Network Policies
  ingressSource:
    # -- Namespace selector for ingress controller
    # @section -- Network Policies
    namespaceSelector: {}
      # kubernetes.io/metadata.name: traefik
    # -- Pod selector for ingress controller
    # @section -- Network Policies
    podSelector: {}
      # app.kubernetes.io/name: traefik

  # -- Components to create network policies for
  # @section -- Network Policies
  components:
    # -- App component
    # @section -- Network Policies
    - name: app
      # -- Component label
      # @section -- Network Policies
      component: app
      # -- Target port
      # @section -- Network Policies
      port: 3000
    # -- Assets component
    # @section -- Network Policies
    - name: assets
      # -- Component label
      # @section -- Network Policies
      component: assets
      # -- Target port
      # @section -- Network Policies
      port: 8080
    # -- CronJobs component
    # @section -- Network Policies
    - name: cronjobs
      # -- Component label
      # @section -- Network Policies
      partOf: cronjob
      # -- Target port
      # @section -- Network Policies
      port: 3000
